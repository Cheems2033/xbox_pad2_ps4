name: Compilar PRX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Compilar usando Docker PS4SDK
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ps4dev/ps4sdk:latest bash -c "make clean && make"

      - name: Subir archivo PRX compilado
        uses: actions/upload-artifact@v4
        with:
          name: xbox_pad_plugin
          path: release/xbox_pad.prx
